syntax = "proto3";

package Fantasy.Network.Message;

// ==================== 公共结构 ====================

// 角色完整数据（进游戏/创角返回复用）
message RoleData
{
    int64 RoleId = 1;
    string UserName = 2;
    int64 Hp = 3;
    int64 MaxHp = 4;
    int64 Mp = 5;
    int64 MaxMp = 6;
    int64 Gold = 7;
    float X = 8;
    float Y = 9;
    float Z = 10;
    float RotationY = 11;
    string NickName = 12;
}

// ==================== 进入游戏 ====================

// Gate → Game：进入游戏（查库验证）
message G2Game_EnterGameRequest // IAddressRequest,Game2G_EnterGameResponse
{
    string UserName = 1;
    int64 GateSessionRuntimeId = 2;  // 玩家挂在哪个Gate Session上
    int64 GateSceneAddress = 3;      // Gate场景的地址
}

// Game → Gate：查库结果
message Game2G_EnterGameResponse // IAddressResponse
{
    int32 AccountErrorCode = 1;
    RoleData Data = 2;    // 有角色时填充
}

// ==================== 创建角色 ====================

// Gate → Game：创建角色
message G2Game_CreateRoleRequest // IAddressRequest,Game2G_CreateRoleResponse
{
    string UserName = 1;
    string NickName = 2;
    int64 GateSessionRuntimeId = 3;
    int64 GateSceneAddress = 4;      // Gate场景的地址
}

// Game → Gate：创建结果
message Game2G_CreateRoleResponse // IAddressResponse
{
    int32 AccountErrorCode = 1;
    RoleData Data = 2;    // 创建成功时填充
}
