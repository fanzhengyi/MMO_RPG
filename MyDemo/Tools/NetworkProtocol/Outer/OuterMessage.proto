syntax = "proto3";
package Fantasy.Network.Message;

///两端必须同步发布；缺少版本号的旧客户端在 Gate 被明确拒绝
enum ProtocolRevision
{
    Unspecified = 0,
    Current = 3,
}

///业务结果；默认值不是成功，Fantasy 的 ErrorCode 只表示框架错误
enum ResultCode
{
    Unknown = 0,
    Success = 1,
    InvalidCredentials = 2,
    AccountExists = 3,
    WrongAuthenticationServer = 4,
    IncorrectCredentials = 5,
    InvalidToken = 6,
    NotAuthenticated = 7,
    RoleNotFound = 8,
    RoleAlreadyExists = 9,
    InvalidNickname = 10,
    ServerError = 11,
    Busy = 12,
    RateLimited = 13,
    UnsupportedProtocol = 14,
    InvalidWorldSession = 15,
}

///网络移动状态，不使用 Animator 的参数编号
enum PlayerMotionState
{
    Idle = 0,
    Walk = 1,
    Jump = 2,
    Run = 3,
    Fall = 4,
}

///位置为世界坐标；RotationY 为角度，Speed 为实际水平速度（米/秒）
message MovementSnapshot
{
    float X = 1;
    float Y = 2;
    float Z = 3;
    float RotationY = 4;
    PlayerMotionState State = 5;
    float Speed = 6;
}

///只发给角色本人的数据，不包含登录账号
message PlayerInfo
{
    int64 RoleId = 1;
    string NickName = 2;
    int64 Hp = 3;
    int64 MaxHp = 4;
    int64 Mp = 5;
    int64 MaxMp = 6;
    int64 Gold = 7;
    MovementSnapshot Movement = 8;
}

///其他玩家可见的初始数据；Version 为移动版本，SpawnRevision 为当前 Game 世界内的上线顺序
message PlayerPresence
{
    int64 RoleId = 1;
    string NickName = 2;
    MovementSnapshot Movement = 3;
    uint32 Version = 4;
    int64 SpawnId = 5;
    int64 ServerTimeMs = 6;
    uint64 SpawnRevision = 7;
}

///注册账号
message C2A_RegisterRequest // IRequest,A2C_RegisterResponse
{
    string Username = 1;
    string Password = 2;
}

///注册结果
message A2C_RegisterResponse // IResponse
{
    ResultCode Result = 1;
}

///鉴权登录
message C2A_LoginRequest // IRequest,A2C_LoginResponse
{
    string Username = 1;
    string Password = 2;
}

///凭证和 Gate 地址分别返回，客户端不用解析 Token
message A2C_LoginResponse // IResponse
{
    string Token = 1;
    ResultCode Result = 2;
    string GateAddress = 3;
}

///账号身份和目标 Gate 均从签名 Token 获取
message C2G_LoginRequest // IRequest,G2C_LoginResponse
{
    string Token = 1;
    uint32 ProtocolVersion = 2;
}

///Gate 登录结果
message G2C_LoginResponse // IResponse
{
    ResultCode Result = 1;
}

///账号在另一条连接登录
message G2C_RepeatLogin // IMessage
{
}

///预备进入公共世界；场景完成后还需 WorldReady，不立即发布上线
message C2G_EnterGameRequest // IRequest,G2C_EnterGameResponse
{
}

///Success 时必须携带 Info；RoleNotFound 时进入创建角色界面
message G2C_EnterGameResponse // IResponse
{
    ResultCode Result = 1;
    PlayerInfo Info = 2;
    int64 WorldSessionId = 3;
    int32 WorldId = 4;
}

///场景加载、角色放置完成后提交；进入与就绪分开，未就绪角色不参与同步
message C2G_WorldReadyRequest // IRequest,G2C_WorldReadyResponse
{
    int64 WorldSessionId = 1;
}

///就绪成功返回当前可见角色的完整基线
message G2C_WorldReadyResponse // IResponse
{
    ResultCode Result = 1;
    repeated PlayerPresence Players = 2;
}

///创建当前账号的唯一角色
message C2G_CreateRoleRequest // IRequest,G2C_CreateRoleResponse
{
    string NickName = 1;
}

///只返回创建结果，角色初始数据统一由 EnterGame 获取
message G2C_CreateRoleResponse // IResponse
{
    ResultCode Result = 1;
}

///客户端移动采样；Sequence 属于当前连接；MovementEpoch 只能回传服务端最近一次回正的代次
message C2G_PlayerMove // IMessage
{
    uint32 Sequence = 1;
    MovementSnapshot Movement = 2;
    int64 WorldSessionId = 3;
    uint32 MovementEpoch = 4;
}

///只用于其他玩家的移动；Version 由 Game 递增生成
message G2C_PlayerMove // IMessage
{
    int64 RoleId = 1;
    uint32 Version = 2;
    MovementSnapshot Movement = 3;
    int64 WorldSessionId = 4;
    int64 SpawnId = 5;
    int64 ServerTimeMs = 6;
    uint64 SpawnRevision = 7;
}

///只发给本人；AckSequence 是触发回正的序号；重复发送同一代次以恢复丢失的回正
message G2C_PlayerPositionCorrection // IMessage
{
    uint32 AckSequence = 1;
    MovementSnapshot Movement = 2;
    int64 WorldSessionId = 3;
    uint32 MovementEpoch = 4;
}

///创建或更新远端角色外观
message G2C_PlayerEntered // IMessage
{
    PlayerPresence Player = 1;
    int64 WorldSessionId = 2;
}

///删除远端角色
message G2C_PlayerLeft // IMessage
{
    int64 RoleId = 1;
    int64 WorldSessionId = 2;
    int64 SpawnId = 3;
    uint64 SpawnRevision = 4;
}
