syntax = "proto3";
package Fantasy.Network.Message;
// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。
// Bson:仅支持在Inner文件里使用。
// 使用方式:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如:// Protocol ProtoBuf 或 // Protocol MemoryPack
///账号模板错误码
enum AccountErrorCode
{
	///服务器内部错误
	ServerError=0,
	///账号或者密码为空
	AccountPaawordEmpty=1,
	///注册时账号存在
	RegisterAccountExist=2,
	///注册成功
	RegisterSuccess=3,
	///注册时这个账号不应该在这个鉴权服务器
	AuthenticationError=4,
	///没有注册账号或者密码错误
	AccountNotExistOrPasswordError=5,
	///登录成功
	LoginSuccess=6,

}
message C2A_RegisterRequest // IRequest,A2C_RegisterResponse
{
	string Username = 1;
	string Password=2;
	
}
message A2C_RegisterResponse // IResponse
{
	AccountErrorCode LoginError=1;
}
message C2A_LoginRequest // IRequest,A2C_LoginResponse
{
	string Username = 1;
	string Password=2;
}
message A2C_LoginResponse // IResponse
{
	string Token=1;
	AccountErrorCode LoginError=2;
}
///客户端登录到Gate服务器
message C2G_LoginRequest // IRequest,G2C_LoginResponse
{
	string Token = 1;
	string UserName=2;
}
message G2C_LoginResponse // IResponse
{
	AccountErrorCode LoginError=1;
}

///有人顶号的时候发送
message G_2C_RepeaLogin//IMessage
{

}
