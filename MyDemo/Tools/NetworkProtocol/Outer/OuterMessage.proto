syntax = "proto3";
package Fantasy.Network.Message;
// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。
// Bson:仅支持在Inner文件里使用。
// 使用方式:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如:// Protocol ProtoBuf 或 // Protocol MemoryPack

///账号模板错误码
enum AccountErrorCode
{
	///服务器内部错误
	ServerError=0,
	///账号或者密码为空
	AccountPaawordEmpty=1,
	///注册时账号存在
	RegisterAccountExist=2,
	///注册成功
	RegisterSuccess=3,
	///注册时这个账号不应该在这个鉴权服务器
	AuthenticationError=4,
	///没有注册账号或者密码错误
	AccountNotExistOrPasswordError=5,
	///登录成功
	LoginSuccess=6,
	///有角色
	HaveRole=7,
	///无角色
	NoRole=8,
	///未登录
	NoLogin=9,
	///玩家昵称不能为空
	NickNameNull=10,
}

// ==================== 注册/登录（客户端 ↔ Authentication） ====================

///注册请求
message C2A_RegisterRequest // IRequest,A2C_RegisterResponse
{
	string Username = 1;
	string Password = 2;
}

///注册响应
message A2C_RegisterResponse // IResponse
{
	AccountErrorCode LoginError = 1;
}

///登录请求（Authentication验证，成功返回Token）
message C2A_LoginRequest // IRequest,A2C_LoginResponse
{
	string Username = 1;
	string Password = 2;
}

///登录响应
message A2C_LoginResponse // IResponse
{
	string Token = 1;
	AccountErrorCode LoginError = 2;
}

// ==================== 登录Gate（客户端 ↔ Gate） ====================

///客户端登录到Gate服务器（带Token验证）
message C2G_LoginRequest // IRequest,G2C_LoginResponse
{
	string Token = 1;
	string UserName = 2;
}

///Gate登录响应
message G2C_LoginResponse // IResponse
{
	AccountErrorCode LoginError = 1;
}

///有人顶号的时候发送
message G_2C_RepeaLogin // IMessage
{
}

// ==================== 公共结构 ====================

///玩家信息（进游戏/创角返回，客户端刷新UI用）
message PlayerInfo
{
	int64 RoleId = 1;
	string UserName = 2;
	int64 Hp = 3;
	int64 MaxHp = 4;
	int64 Mp = 5;
	int64 MaxMp = 6;
	int64 Gold = 7;
	float X = 8;
	float Y = 9;
	float Z = 10;
	float RotationY = 11;
	string NickName = 12;
}

// ==================== 进入游戏 ====================

///登录成功后请求进入游戏（服务端判断是否有角色）
message C2G_EnterGameRequest // IRequest,G2C_EnterGameResponse
{
}

///进入游戏响应：错误码 + 玩家信息
message G2C_EnterGameResponse // IResponse
{
	int32 AccountErrorCode = 1;     // HaveRole=有角色 NoRole=无角色 NoLogin=未登录
	PlayerInfo Info = 2;            // 有角色时有值
}

// ==================== 创建角色 ====================

///客户端请求创建角色（当前只有默认职业，只传昵称）
message C2G_CreateRoleRequest // IRequest,G2C_CreateRoleResponse
{
	string NickName = 1;
}

///创建角色响应
message G2C_CreateRoleResponse // IResponse
{
	int32 AccountErrorCode = 1;     // HaveRole=创建成功并已有角色，NoRole=失败
	PlayerInfo Info = 2;            // 成功后返回角色信息
}
